<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
  <title>若娜瓦 · 桌面巡游</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <main id="stage" aria-label="若娜瓦桌宠">
    <section id="bubble" class="bubble hidden" aria-live="polite">
      <div class="bubble-heading"><span id="bubbleStatus">余烬低语</span><span id="pageNumber"></span></div>
      <div id="bubbleText" class="bubble-text"></div>
      <div class="bubble-foot"><span id="bubbleHint">双击她，打开聊天</span><button id="nextPage" title="下一段" aria-label="下一段">›</button></div>
    </section>
    <div id="aura" class="aura" aria-hidden="true"></div>
    <div id="pet" class="pet" role="img" aria-label="Q版若娜瓦：拖动移动，双击聊天，右键互动" tabindex="0">
      <canvas id="petCanvas" width="288" height="256"></canvas>
    </div>
    <div id="effects" class="effects" aria-hidden="true"></div>
    <div id="mood" class="mood" aria-hidden="true"></div>
    <nav id="petMenu" class="pet-menu hidden" aria-label="若娜瓦互动">
      <div class="menu-title">片刻，予你。</div>
      <div id="actionButtons" class="action-buttons"></div>
      <div class="menu-bottom"><button id="openChat">打开聊天</button><button id="closeMenu">收起</button></div>
    </nav>
  </main>
  <script src="character.js"></script>
  <script src="speech.js"></script>
  <script src="animation-clock.js"></script>
  <script src="pet.js"></script>
</body>
</html>
